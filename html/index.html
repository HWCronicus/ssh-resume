<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlanGeorge.Dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        font-family: "Fira Code", monospace;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .buttons {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        z-index: 10;
      }
      button {
        padding: 15px 30px;
        font-family: "Fira Code", monospace;
        font-size: 16px;
        font-weight: 600;
        background: rgba(30, 30, 30, 0.9);
        color: #ff8800;
        border: 2px solid #ff8800;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }
      button:hover {
        background: #ff8800;
        color: #1a1a1a;
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(255, 136, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="buttons">
      <button onclick="window.open('https://github.com/HWCronicus', '_blank')">
        GitHub
      </button>
      <button onclick="window.open('mailto:alan@alang.dev', '_blank')">
        Email
      </button>
      <button onclick="openTerminal()">Terminal Example</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      let scene, camera, renderer, textMesh;
      let hoverOffset = 0;

      function init() {
        // Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 10, 50);

        // Camera
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 2, 0);

        // Renderer
        renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("canvas"),
          antialias: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xff8800, 1, 50);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffaa33, 0.8, 50);
        pointLight2.position.set(-10, 8, -10);
        scene.add(pointLight2);

        const spotLight = new THREE.SpotLight(0xffffff, 0.5);
        spotLight.position.set(0, 15, 0);
        spotLight.target.position.set(0, 0, 0);
        scene.add(spotLight);
        scene.add(spotLight.target);

        // Floor with checkered pattern
        const floorSize = 100;
        const gridSize = 50;
        const squareSize = floorSize / gridSize;

        const floorGroup = new THREE.Group();

        for (let i = 0; i < gridSize; i++) {
          for (let j = 0; j < gridSize; j++) {
            const isLight = (i + j) % 2 === 0;
            const squareGeometry = new THREE.PlaneGeometry(
              squareSize,
              squareSize,
            );
            const squareMaterial = new THREE.MeshStandardMaterial({
              color: isLight ? 0x1a1a1a : 0x0f0f0f,
              metalness: 0.3,
              roughness: 0.8,
            });
            const square = new THREE.Mesh(squareGeometry, squareMaterial);
            square.rotation.x = -Math.PI / 2;
            square.position.set(
              (i - gridSize / 2) * squareSize + squareSize / 2,
              0,
              (j - gridSize / 2) * squareSize + squareSize / 2,
            );
            floorGroup.add(square);
          }
        }

        scene.add(floorGroup);

        const loader = new THREE.FontLoader();
        loader.load("assets/fira_code.json", function (font) {
          const textGeometry = new THREE.TextGeometry("AlanGeorge.Dev", {
            font: font,
            size: 2.0,
            height: 0.3,
            curveSegments: 12,
            bevelEnabled: true,
            bevelThickness: 0.05,
            bevelSize: 0.05,
            bevelOffset: 0,
            bevelSegments: 5,
          });

          textGeometry.computeBoundingBox();
          const centerOffset =
            -0.5 *
            (textGeometry.boundingBox.max.x - textGeometry.boundingBox.min.x);

          const textMaterial = new THREE.MeshStandardMaterial({
            color: 0xff8800,
            metalness: 0.6,
            roughness: 0.2,
            emissive: 0xff8800,
            emissiveIntensity: 0.2,
          });

          textMesh = new THREE.Mesh(textGeometry, textMaterial);
          textMesh.position.x = centerOffset;
          textMesh.position.y = 3.5;
          textMesh.position.z = 0;
          scene.add(textMesh);

          // Description text
          const descGeometry = new THREE.TextGeometry(
            "Full Stack Developer & Creative Technologist",
            {
              font: font,
              size: 0.35,
              height: 0.08,
              curveSegments: 8,
              bevelEnabled: true,
              bevelThickness: 0.02,
              bevelSize: 0.02,
              bevelOffset: 0,
              bevelSegments: 3,
            },
          );

          descGeometry.computeBoundingBox();
          const descCenterOffset =
            -0.5 *
            (descGeometry.boundingBox.max.x - descGeometry.boundingBox.min.x);

          const descMaterial = new THREE.MeshStandardMaterial({
            color: 0xffaa33,
            metalness: 0.4,
            roughness: 0.3,
            emissive: 0xff8800,
            emissiveIntensity: 0.1,
          });

          const descMesh = new THREE.Mesh(descGeometry, descMaterial);
          descMesh.position.x = descCenterOffset;
          descMesh.position.y = 2.2;
          descMesh.position.z = 0;
          scene.add(descMesh);
        });

        window.addEventListener("resize", onWindowResize, false);

        animate();
      }

      function onWindowResize() {
        const vFOV = (camera.fov * Math.PI) / 180; // vertical field of view in radians
        const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
        const width = height * (window.innerWidth / window.innerHeight);

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        hoverOffset += 0.02;
        if (textMesh) {
          textMesh.position.y = 3.5 + Math.sin(hoverOffset) * 0.15;
          textMesh.rotation.y = Math.sin(hoverOffset * 0.5) * 0.05;
        }

        renderer.render(scene, camera);
      }

      function openTerminal() {
        const width = 1600;
        const height = 900;
        const left = (screen.width - width) / 2;
        const top = (screen.height - height) / 2;

        window.open(
          "/terminal",
          "terminal",
          `width=${width},height=${height},left=${left},top=${top},resizable=no,scrollbars=no,toolbar=no,menubar=no,location=no,status=no`,
        );
      }

      init();
    </script>
  </body>
</html>
