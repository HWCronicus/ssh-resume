<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSH Terminal</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #1e1e1e;
        color: #fff;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: #2d2d2d;
        padding: 15px 20px;
        border-bottom: 1px solid #3d3d3d;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 500;
      }

      .terminal-container {
        flex: 1;
        padding: 20px;
        overflow: hidden;
      }

      #terminal {
        width: 100%;
        height: 100%;
      }

      .status {
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 12px;
        display: inline-block;
        margin-left: 15px;
      }

      .status.connected {
        background: #0a5a0a;
        color: #4ade80;
      }

      .status.disconnected {
        background: #5a0a0a;
        color: #f87171;
      }

      .status.connecting {
        background: #5a4a0a;
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>
        SSH Terminal
        <span id="status" class="status connecting">Connecting...</span>
      </h1>
    </div>
    <div class="terminal-container">
      <div id="terminal"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.8.0/lib/xterm-addon-web-links.min.js"></script>
    <script>
      const term = new Terminal({
        cursorBlink: true,
        fontSize: 12,
        fontFamily: '"Cascadia Code", monospace',
        theme: {
          background: "#1e1e1e",
          foreground: "#d4d4d4",
          cursor: "#d4d4d4",
          black: "#000000",
          red: "#cd3131",
          green: "#0dbc79",
          yellow: "#e5e510",
          blue: "#2472c8",
          magenta: "#bc3fbc",
          cyan: "#11a8cd",
          white: "#e5e5e5",
          brightBlack: "#666666",
          brightRed: "#f14c4c",
          brightGreen: "#23d18b",
          brightYellow: "#f5f543",
          brightBlue: "#3b8eea",
          brightMagenta: "#d670d6",
          brightCyan: "#29b8db",
          brightWhite: "#e5e5e5",
        },
      });

      const fitAddon = new FitAddon.FitAddon();
      const webLinksAddon = new WebLinksAddon.WebLinksAddon();

      term.loadAddon(fitAddon);
      term.loadAddon(webLinksAddon);
      term.open(document.getElementById("terminal"));
      fitAddon.fit();

      // Status management
      const statusEl = document.getElementById("status");
      function setStatus(status) {
        statusEl.className = `status ${status}`;
        statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
      }

      // WebSocket connection
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${window.location.host}/ws`;
      let ws;

      function connect() {
        setStatus("connecting");
        ws = new WebSocket(wsUrl);

        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          setStatus("connected");

          // Send terminal size
          ws.send(
            JSON.stringify({
              type: "resize",
              cols: term.cols,
              rows: term.rows,
            }),
          );
        };

        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            term.write(event.data);
          } else {
            // Handle binary data
            const uint8Array = new Uint8Array(event.data);
            term.write(uint8Array);
          }
        };

        ws.onerror = (error) => {
          console.error("WebSocket error:", error);
          setStatus("disconnected");
        };

        ws.onclose = () => {
          setStatus("disconnected");
          term.write(
            "\r\n\r\n\x1b[31mConnection closed. Reconnecting in 3 seconds...\x1b[0m\r\n",
          );
          setTimeout(connect, 3000);
        };
      }

      term.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "input",
              data: data,
            }),
          );
        }
      });

      term.onResize(({ cols, rows }) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(
            JSON.stringify({
              type: "resize",
              cols: cols,
              rows: rows,
            }),
          );
        }
      });

      window.addEventListener("resize", () => {
        fitAddon.fit();
      });

      connect();

      term.focus();
    </script>
  </body>
</html>
